name: Kualitas backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alos-backend
    steps:
      - name: Checkout ALOS Backend repository
        uses: actions/checkout@v4
        with:
          path: alos-backend

      - name: Checkout canonical contracts
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-contracts
          ref: main
          path: alos-contracts
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alos-backend/pyproject.toml

      - name: Pasang dependency
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Uji import dan startup aplikasi
        run: python -c "from alos.main import app; assert app.title == 'ALOS Backend'"
