name: Kualitas backend

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alos
          POSTGRES_PASSWORD: alos
          POSTGRES_DB: alos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alos -d alos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://alos:alos@127.0.0.1:5432/alos_test
      ALOS_TEST_DATABASE_URL: postgresql+asyncpg://alos:alos@127.0.0.1:5432/alos_test
      ALOS_CONTRACTS_PATH: ${{ github.workspace }}/alos-contracts
    defaults:
      run:
        working-directory: alos-backend
    steps:
      - name: Checkout ALOS Backend repository
        uses: actions/checkout@v4
        with:
          path: alos-backend

      - name: Checkout canonical contracts
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-contracts
          ref: development
          path: alos-contracts
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alos-backend/pyproject.toml

      - name: Pasang dependency
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Verifikasi migration PostgreSQL
        run: pytest tests/integration/test_postgres_migrations.py

      - name: Pytest
        run: pytest

      - name: Uji import dan startup aplikasi
        run: python -c "from alos.main import app; assert app.title == 'ALOS Backend'"
